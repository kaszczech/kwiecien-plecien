# Kalendarz terminów używanych w przysłowiach.
# data = "MM-DD" (kalendarz gregoriański) albo ruchome = "<nazwa algorytmu>".
# Przysłowia odnoszą się do tradycyjnego kalendarza ludowego; tam, gdzie współczesny kalendarz
# liturgiczny przesunął wspomnienie, używamy daty tradycyjnej i zaznaczamy to w 'uwagi'.

[barbara]
nazwa = "św. Barbara"
data = "12-04"
zrodlo = "wspomnienie św. Barbary, 4 grudnia (kalendarz liturgiczny i ludowy)"

