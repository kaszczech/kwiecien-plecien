# Reguły przysłów pogodowych (PILOTAŻ – 12 reguł do przeglądu przed formalizacją reszty).
#
# Schemat jednej reguły:
#   id            - unikalny identyfikator
#   typ           - warunkowe | dzien | od_dnia | okres (zgodny z kategorią wariantów)
#   warianty      - teksty przysłów (dokładnie jak w data/przyslowia_pogodowe.json) o IDENTYCZNYM znaczeniu
#   interpretacja - jednym zdaniem, co reguła twierdzi
#   pewnosc       - wysoka | srednia | niska  (pewność interpretacji, nie trafności!)
#   uwagi         - wątpliwości, alternatywne interpretacje, decyzje do podjęcia
#
#   [regula.warunek]        (tylko typ 'warunkowe')
#     okno    = { od = ..., do = ... }   kalendarz.toml klucz | "MM-DD" | "MM-koniec"
#     zjawisko + slowa                   warunek progowy/anomalia ze słownika
#     albo grupa + stan = "dowolny"      dla reguł 'jaki X, taki Y'
#
#   [[regula.przewidywanie]] (jedno lub więcej, każde dla jednej zmiennej lub grupy)
#     okno    = { od = ..., do = ... }   do może być też "koniec_pory_roku"
#     zjawisko + slowa
#     albo grupa + relacja = "taki_sam" | "przeciwny"
#
# Okno przewidywania = pierwsze wystąpienie zaczynające się w dniu warunku lub później
# (dla reguł bez warunku – w roku kalendarzowym). Szczegóły: METODOLOGIA.md, rozdz. 3.

# ======================================================================== warunkowe

[[regula]]
id = "barbara_odwilz__boze_narodzenie_mroz"
typ = "warunkowe"
warianty = [
    "Barbara po wodzie, Boże Narodzenie po lodzie",
    "święta Barbara po wodzie, Boże Narodzenie po lodzie",
    "święto Barbary po wodzie, Boże Narodzenie po lodzie",
]
interpretacja = "Odwilż na św. Barbarę zapowiada dzień mroźny w Boże Narodzenie."
pewnosc = "srednia"
uwagi = ["Para z regułą barbara_mroz__boze_narodzenie_odwilz: razem twierdzą, że pogoda w Boże Narodzenie jest odwrotna niż na Barbarę."]

[regula.warunek]
okno = { od = "barbara", do = "barbara" }
zjawisko = "tsr_dodatnia"
slowa = ["po wodzie"]

[[regula.przewidywanie]]
okno = { od = "boze_narodzenie", do = "boze_narodzenie" }
zjawisko = "dzien_mrozny"
slowa = ["po lodzie"]


