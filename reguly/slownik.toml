pewnosc = "wysoka"
uzasadnienie = "Zima zimniejsza niż zwykle. Nie wymagamy dnia mroźnego (Tmax < 0) w każdy dzień – to byłoby dużo mocniejsze twierdzenie niż sens przysłowia."

[[slowo]]
tekst = "ciepło trzyma"
