uzasadnienie = "Dzień z opadem. Nie rozróżniamy deszczu i śniegu – pod koniec września opad to praktycznie zawsze deszcz."

[[slowo]]
tekst = "łagodna zima"
zjawisko = "temp_powyzej_normy"
